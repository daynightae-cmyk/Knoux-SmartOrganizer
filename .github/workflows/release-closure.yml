name: Release Closure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PRODUCT_VERSION: "0.4.0"
  INSTALLER_NAME: "KNOuX-SmartOrganizer-Setup-x64.exe"
  APP_EXE_NAME: "KNOuX SmartOrganizer.exe"

jobs:
  windows-release-gate:
    name: Windows release gate
    runs-on: windows-latest
    outputs:
      signed: ${{ steps.evidence.outputs.signed }}
      installer_sha256: ${{ steps.evidence.outputs.installer_sha256 }}
      app_sha256: ${{ steps.evidence.outputs.app_sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run check

      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build unsigned verification distribution
        run: npm run desktop:dist

      - name: Baseline packaged operations smoke
        run: npm run smoke:packaged-operations

      - name: Baseline installer lifecycle smoke
        run: npm run smoke:installer

      - name: Baseline offline packaged smoke
        run: npm run smoke:offline

      - name: Existing repository release gate
        run: npm run verify:release

      - name: Prepare optional Authenticode identity for final package
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)
          if ($hasPfx -and $hasPassword) {
            $pfxPath = Join-Path $env:RUNNER_TEMP 'knoux-signing.pfx'
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            "CSC_LINK=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CSC_KEY_PASSWORD=$env:SIGNING_PFX_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "SIGNING_EXPECTED=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            "SIGNING_EXPECTED=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Warning 'Trusted Authenticode secrets are not configured; final packaging will remain unsigned and the signed release gate will fail truthfully.'
          }

      - name: Build final distribution artifact
        run: npm run desktop:dist

      - name: Clear signing material before executing product tests
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'knoux-signing.pfx') -Force -ErrorAction SilentlyContinue
          "CSC_LINK=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CSC_KEY_PASSWORD=" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Final packaged operations smoke
        run: npm run smoke:packaged-operations

      - name: Final installer lifecycle smoke
        run: npm run smoke:installer

      - name: Final offline packaged smoke
        run: npm run smoke:offline

      - name: Verify final package without rebuilding it
        run: node scripts/verify-release.cjs

      - name: Record Authenticode and final hashes
        id: evidence
        shell: pwsh
        run: |
          $installer = Join-Path $PWD "release\$env:INSTALLER_NAME"
          $app = Join-Path $PWD "release\win-unpacked\$env:APP_EXE_NAME"
          if (-not (Test-Path $installer)) { throw "Missing installer: $installer" }
          if (-not (Test-Path $app)) { throw "Missing application executable: $app" }

          $items = @()
          foreach ($file in @($installer, $app)) {
            $sig = Get-AuthenticodeSignature -LiteralPath $file
            $hash = Get-FileHash -LiteralPath $file -Algorithm SHA256
            $items += [pscustomobject]@{
              file = [IO.Path]::GetFileName($file)
              path = $file
              size = (Get-Item -LiteralPath $file).Length
              sha256 = $hash.Hash.ToLowerInvariant()
              authenticodeStatus = [string]$sig.Status
              signerSubject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { $null }
              signerIssuer = if ($sig.SignerCertificate) { $sig.SignerCertificate.Issuer } else { $null }
              signerThumbprint = if ($sig.SignerCertificate) { $sig.SignerCertificate.Thumbprint } else { $null }
              timestampPresent = $null -ne $sig.TimeStamperCertificate
              timestampSubject = if ($sig.TimeStamperCertificate) { $sig.TimeStamperCertificate.Subject } else { $null }
            }
          }

          $allValid = ($items | Where-Object { $_.authenticodeStatus -ne 'Valid' -or -not $_.timestampPresent }).Count -eq 0
          $status = if ($allValid) { 'SIGNED_CI_CANDIDATE' } else { 'UNSIGNED_PRODUCTION_CANDIDATE' }
          $record = [pscustomobject]@{
            product = 'KNOuX SmartOrganizer'
            version = $env:PRODUCT_VERSION
            sourceCommit = '${{ github.sha }}'
            workflowRunId = '${{ github.run_id }}'
            generatedAt = (Get-Date).ToUniversalTime().ToString('o')
            signingExpected = ($env:SIGNING_EXPECTED -eq 'true')
            releaseStatus = $status
            artifacts = $items
          }

          New-Item -ItemType Directory -Force -Path 'docs\evidence' | Out-Null
          $record | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath 'docs\evidence\ci-release-closure.json' -Encoding utf8

          $installerRecord = $items | Where-Object { $_.file -eq $env:INSTALLER_NAME } | Select-Object -First 1
          $appRecord = $items | Where-Object { $_.file -eq $env:APP_EXE_NAME } | Select-Object -First 1
          "signed=$($allValid.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "installer_sha256=$($installerRecord.sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "app_sha256=$($appRecord.sha256)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

          $record | ConvertTo-Json -Depth 8
          if ($env:SIGNING_EXPECTED -eq 'true' -and -not $allValid) {
            Write-Error 'Signing credentials were supplied, but one or more final artifacts are not Valid and timestamped.'
          }

      - name: Upload exact release candidate and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-candidate
          if-no-files-found: error
          retention-days: 14
          path: |
            release/KNOuX-SmartOrganizer-Setup-x64.exe
            release/win-unpacked/KNOuX SmartOrganizer.exe
            docs/evidence/*.json

      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'knoux-signing.pfx') -Force -ErrorAction SilentlyContinue

      - name: Enforce signed release gate
        shell: pwsh
        run: |
          if ('${{ steps.evidence.outputs.signed }}' -ne 'true') {
            Write-Error 'Release closure remains blocked: the final installer and application executable are not both Valid Authenticode signatures with timestamps.'
            exit 1
          }

  clean-machine-verification:
    name: Fresh Windows installer verification
    needs: windows-release-gate
    if: always() && needs.windows-release-gate.result != 'cancelled'
    runs-on: windows-latest
    steps:
      - name: Download exact candidate
        uses: actions/download-artifact@v4
        with:
          name: windows-release-candidate
          path: ${{ runner.temp }}/candidate

      - name: Verify on fresh runner without checkout or node_modules
        shell: pwsh
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP 'candidate'
          $installer = Get-ChildItem -LiteralPath $candidate -Recurse -Filter 'KNOuX-SmartOrganizer-Setup-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer artifact is missing from downloaded candidate.' }

          $installerHash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerSig = Get-AuthenticodeSignature -LiteralPath $installer.FullName

          $installDir = Join-Path $env:RUNNER_TEMP 'knoux-clean-install'
          $fixtureRoot = Join-Path $env:RUNNER_TEMP 'knoux-clean-fixtures'
          $fixture = Join-Path $fixtureRoot 'fixture'
          $cleanupFixture = Join-Path $fixtureRoot 'cleanup'
          $cancelFixture = Join-Path $fixtureRoot 'cancel'
          $operationOutput = Join-Path $env:RUNNER_TEMP 'clean-operations.json'
          $settingsOutput = Join-Path $env:RUNNER_TEMP 'clean-settings.json'
          $startupValue = "KNOuXClean_$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())"

          Remove-Item -LiteralPath $installDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $fixtureRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $fixture, $cleanupFixture, $cancelFixture | Out-Null

          Set-Content -LiteralPath (Join-Path $fixture 'hash-fixture.txt') -Value "KNOuX clean runner smoke"
          Set-Content -LiteralPath (Join-Path $fixture 'duplicate-a.txt') -Value "same-content"
          Set-Content -LiteralPath (Join-Path $fixture 'duplicate-b.txt') -Value "same-content"
          Set-Content -LiteralPath (Join-Path $fixture 'photo.jpg') -Value "fixture-image"
          $agedFile = Join-Path $cleanupFixture 'recoverable-aged-temp-file.tmp'
          Set-Content -LiteralPath $agedFile -Value 'restore-me'
          (Get-Item -LiteralPath $agedFile).LastWriteTimeUtc = (Get-Date).ToUniversalTime().AddDays(-31)
          0..129 | ForEach-Object {
            $dir = Join-Path $cancelFixture "entry-$_"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            Set-Content -LiteralPath (Join-Path $dir 'fixture.txt') -Value $_
          }

          & reg.exe add 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run' /v $startupValue /t REG_SZ /d 'cmd.exe /c exit 0' /f | Out-Null
          try {
            $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "Silent install failed with exit code $($install.ExitCode)." }

            $exe = Join-Path $installDir 'KNOuX SmartOrganizer.exe'
            if (-not (Test-Path $exe)) { throw 'Installed executable is missing.' }

            $args = @(
              "--knoux-settings-smoke-output=$settingsOutput",
              "--knoux-operation-smoke-output=$operationOutput",
              "--knoux-operation-smoke-fixture=$fixture",
              "--knoux-temp-cleanup-smoke-fixture=$cleanupFixture",
              "--knoux-cancel-smoke-fixture=$cancelFixture",
              "--knoux-startup-smoke-value=$startupValue"
            )
            $run = Start-Process -FilePath $exe -ArgumentList $args -Wait -PassThru
            if ($run.ExitCode -ne 0) { throw "Installed application smoke failed with exit code $($run.ExitCode)." }
            if (-not (Test-Path $operationOutput) -or -not (Test-Path $settingsOutput)) { throw 'Installed application did not emit smoke evidence.' }

            $operations = Get-Content -LiteralPath $operationOutput -Raw | ConvertFrom-Json
            $settings = Get-Content -LiteralPath $settingsOutput -Raw | ConvertFrom-Json
            if (-not $operations.packaged -or -not $settings.packaged) { throw 'Clean-runner smoke was not executed by a packaged application.' }
            foreach ($key in @('health','smartScan','disks','processes','installedApps','networkDiagnostics','hardwareInventory','hash','large','duplicates','preview','apply','undo','cleanupPreview','cleanupApply','cleanupUndo','startupDisable','startupRestore','automationRun','adminDryRun')) {
              if (-not $operations.evidence.$key.success) { throw "Clean-runner operation failed: $key" }
            }
            if (-not $settings.evidence.accessibility.applied) { throw 'Accessibility/RTL packaged transition did not apply on clean runner.' }

            $uninstaller = Get-ChildItem -LiteralPath $installDir -Filter 'Uninstall *.exe' | Select-Object -First 1
            if (-not $uninstaller) { throw 'NSIS uninstaller is missing.' }
            $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed with exit code $($uninstall.ExitCode)." }

            $reinstall = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -Wait -PassThru
            if ($reinstall.ExitCode -ne 0) { throw "Silent reinstall failed with exit code $($reinstall.ExitCode)." }
            if (-not (Test-Path (Join-Path $installDir 'KNOuX SmartOrganizer.exe'))) { throw 'Executable missing after reinstall.' }

            $os = Get-CimInstance Win32_OperatingSystem
            $evidence = [pscustomobject]@{
              capturedAt = (Get-Date).ToUniversalTime().ToString('o')
              sourceCommit = '${{ github.sha }}'
              environment = 'fresh GitHub-hosted windows-latest runner; no repository checkout and no node_modules in this job'
              osCaption = $os.Caption
              osVersion = $os.Version
              osBuildNumber = $os.BuildNumber
              architecture = $env:PROCESSOR_ARCHITECTURE
              installerSha256 = $installerHash
              authenticodeStatus = [string]$installerSig.Status
              timestampPresent = $null -ne $installerSig.TimeStamperCertificate
              install = 'PASS'
              packagedLaunch = 'PASS'
              coreOperations = 'PASS'
              uninstall = 'PASS'
              reinstall = 'PASS'
            }
            $evidence | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'clean-machine-smoke.json') -Encoding utf8
            $evidence | ConvertTo-Json -Depth 6
          }
          finally {
            & reg.exe delete 'HKCU\Software\Microsoft\Windows\CurrentVersion\Run' /v $startupValue /f 2>$null | Out-Null
          }

      - name: Upload clean-machine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clean-machine-evidence
          if-no-files-found: warn
          path: ${{ runner.temp }}/clean-machine-smoke.json

      - name: Enforce clean-runner signature
        shell: pwsh
        run: |
          $candidate = Join-Path $env:RUNNER_TEMP 'candidate'
          $installer = Get-ChildItem -LiteralPath $candidate -Recurse -Filter 'KNOuX-SmartOrganizer-Setup-x64.exe' | Select-Object -First 1
          $sig = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($sig.Status -ne 'Valid' -or $null -eq $sig.TimeStamperCertificate) {
            Write-Error 'Clean-runner artifact is not a Valid timestamped Authenticode installer.'
            exit 1
          }
