name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Source verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  windows-package:
    name: Windows packaged runtime verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run check
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build NSIS distribution
        run: npm run desktop:dist
      - name: Packaged operations smoke
        run: npm run smoke:packaged-operations
      - name: Installer lifecycle smoke
        run: npm run smoke:installer
      - name: Offline packaged smoke
        run: npm run smoke:offline
      # The full matrix is 56 real captures, and each one boots the packaged
      # application and waits for a genuine Windows read before it photographs
      # the window. Measured on this runner, that is more than the single
      # 1800-second step could hold, so the pass died mid-matrix rather than
      # failing on a layout. The fix is to bound the work, not the assertions:
      # the same scenarios run in two slices, split by how expensive each world's
      # read is, each with its own ceiling so a hang names itself. Nothing is
      # skipped, no gate is loosened, and the evidence ledger merges the two
      # slices by scenario name.
      - name: Visual acceptance — data-driven worlds
        env:
          KNOUX_SMOKE_ONLY: applications,files,storage,automation
          KNOUX_SMOKE_TIMEOUT_MS: 1500000
        timeout-minutes: 26
        run: npm run smoke:visual
      - name: Visual acceptance — workspaces and shells
        env:
          KNOUX_SMOKE_ONLY: home,clipboard,cleanup,startup,system,repair,services,network,hardware,studio
          KNOUX_SMOKE_TIMEOUT_MS: 1500000
        timeout-minutes: 26
        run: npm run smoke:visual
      - name: Report the Authenticode state of the built artifacts
        run: npm run signing:verify
      - name: Generate the artifact manifest
        run: npm run artifact:manifest
      - name: Verify release evidence without signing claim
        run: node scripts/verify-release.cjs
