<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 240" fill="none" preserveAspectRatio="none" width="100%" height="100%">
  <defs>
    <!-- Background space gradient -->
    <linearGradient id="space-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020612" />
      <stop offset="45%" stop-color="#040c1d" />
      <stop offset="100%" stop-color="#08142b" />
    </linearGradient>

    <!-- Planet Earth surface body gradient -->
    <linearGradient id="earth-body-grad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#071739" />
      <stop offset="25%" stop-color="#05102a" />
      <stop offset="60%" stop-color="#030816" />
      <stop offset="100%" stop-color="#01040a" />
    </linearGradient>

    <!-- Atmospheric Limb Gradient along the curve -->
    <linearGradient id="atmo-limb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="35%" stop-color="#0369a1" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.85" />
      <stop offset="72%" stop-color="#38bdf8" stop-opacity="0.95" />
      <stop offset="78%" stop-color="#e0f2fe" stop-opacity="1" />
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.5" />
    </linearGradient>

    <!-- High-intensity Corona / Solar bloom -->
    <radialGradient id="solar-burst" cx="74%" cy="26%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="8%" stop-color="#e0f2fe" stop-opacity="0.95" />
      <stop offset="22%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#1e3a8a" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <!-- Anamorphic lens streak -->
    <linearGradient id="lens-streak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Gaussian blurs for atmospheric glow -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="corona-bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep space base -->
  <rect width="1440" height="240" fill="url(#space-grad)" />

  <!-- Stars in upper sky -->
  <g opacity="0.85">
    <circle cx="85" cy="35" r="1" fill="#ffffff" opacity="0.6" />
    <circle cx="140" cy="70" r="1.5" fill="#bae6fd" opacity="0.8" />
    <circle cx="210" cy="25" r="0.8" fill="#ffffff" opacity="0.5" />
    <circle cx="320" cy="45" r="1.2" fill="#ffffff" opacity="0.7" />
    <circle cx="430" cy="18" r="1.8" fill="#e0f2fe" opacity="0.9" />
    <circle cx="510" cy="55" r="0.9" fill="#ffffff" opacity="0.6" />
    <circle cx="620" cy="30" r="1.4" fill="#7dd3fc" opacity="0.85" />
    <circle cx="700" cy="15" r="1" fill="#ffffff" opacity="0.7" />
    <circle cx="810" cy="40" r="1.6" fill="#e0f2fe" opacity="0.9" />
    <circle cx="920" cy="22" r="1.1" fill="#ffffff" opacity="0.65" />
    <circle cx="1180" cy="18" r="1.5" fill="#bae6fd" opacity="0.8" />
    <circle cx="1290" cy="48" r="1.2" fill="#ffffff" opacity="0.75" />
    <circle cx="1360" cy="28" r="1.7" fill="#e0f2fe" opacity="0.9" />
  </g>

  <!-- Distant atmospheric haze / nebula glow -->
  <ellipse cx="1060" cy="62" rx="340" ry="110" fill="#0284c7" opacity="0.22" filter="url(#corona-bloom)" />
  <ellipse cx="1100" cy="60" rx="180" ry="60" fill="#38bdf8" opacity="0.35" filter="url(#soft-glow)" />

  <!-- Earth body (the curvature of the planet) -->
  <!-- Curve apex at (1060, 60), starting at (280, 140) and curving down to (1440, 175) -->
  <path d="M 240,155 Q 660,75 1060,60 T 1440,175 L 1440,240 L 240,240 Z" fill="url(#earth-body-grad)" />

  <!-- City Lights Network (Golden / Amber terrestrial night glow) -->
  <g opacity="0.92">
    <!-- Main metropolitan light clusters on night side -->
    <ellipse cx="1120" cy="115" rx="45" ry="14" fill="#f59e0b" opacity="0.45" filter="url(#soft-glow)" />
    <ellipse cx="1210" cy="135" rx="55" ry="16" fill="#fbbf24" opacity="0.4" filter="url(#soft-glow)" />
    <ellipse cx="1320" cy="165" rx="60" ry="18" fill="#d97706" opacity="0.45" filter="url(#soft-glow)" />
    <ellipse cx="980" cy="105" rx="35" ry="12" fill="#f59e0b" opacity="0.35" filter="url(#soft-glow)" />
    <ellipse cx="860" cy="120" rx="30" ry="10" fill="#fbbf24" opacity="0.3" filter="url(#soft-glow)" />

    <!-- Branching Highway / Coastal light filaments -->
    <path d="M 820,128 Q 880,122 940,114 T 1060,98 T 1160,118 T 1280,148 T 1390,185" 
          stroke="#fde047" stroke-width="1.2" stroke-opacity="0.65" stroke-dasharray="2 3 5 2" fill="none" />
    <path d="M 960,118 Q 1040,135 1140,145 T 1260,175" 
          stroke="#fbbf24" stroke-width="1" stroke-opacity="0.5" stroke-dasharray="3 4 2" fill="none" />
    <path d="M 1080,102 Q 1120,125 1180,132 T 1300,162" 
          stroke="#f59e0b" stroke-width="1.4" stroke-opacity="0.6" stroke-dasharray="4 2 1" fill="none" />

    <!-- Dense pinpoint city dots -->
    <circle cx="1060" cy="98" r="1.8" fill="#ffffff" opacity="0.95" />
    <circle cx="1075" cy="104" r="1.4" fill="#fde047" opacity="0.9" />
    <circle cx="1090" cy="112" r="2.2" fill="#fef08a" opacity="1" />
    <circle cx="1115" cy="116" r="1.6" fill="#f59e0b" opacity="0.85" />
    <circle cx="1135" cy="122" r="2.0" fill="#ffffff" opacity="0.95" />
    <circle cx="1155" cy="120" r="1.5" fill="#fde047" opacity="0.8" />
    <circle cx="1180" cy="130" r="2.4" fill="#fef08a" opacity="1" />
    <circle cx="1205" cy="136" r="1.8" fill="#f59e0b" opacity="0.9" />
    <circle cx="1225" cy="144" r="2.1" fill="#ffffff" opacity="0.95" />
    <circle cx="1250" cy="150" r="1.6" fill="#fde047" opacity="0.85" />
    <circle cx="1285" cy="160" r="2.3" fill="#fef08a" opacity="1" />
    <circle cx="1310" cy="168" r="1.7" fill="#f59e0b" opacity="0.85" />
    <circle cx="1340" cy="176" r="2.0" fill="#ffffff" opacity="0.9" />
    <circle cx="1370" cy="186" r="1.5" fill="#fde047" opacity="0.8" />
    <circle cx="1400" cy="195" r="1.8" fill="#fef08a" opacity="0.85" />
    
    <circle cx="940" cy="110" r="1.5" fill="#fde047" opacity="0.75" />
    <circle cx="975" cy="105" r="1.9" fill="#fef08a" opacity="0.9" />
    <circle cx="1010" cy="100" r="1.6" fill="#ffffff" opacity="0.85" />
    <circle cx="880" cy="124" r="1.4" fill="#fde047" opacity="0.7" />
    <circle cx="840" cy="132" r="1.2" fill="#f59e0b" opacity="0.65" />
  </g>

  <!-- Atmospheric cloud ribbons over night side -->
  <path d="M 680,125 Q 920,88 1120,90 T 1360,150" 
        stroke="#7dd3fc" stroke-width="6" stroke-opacity="0.12" fill="none" filter="url(#soft-glow)" />
  <path d="M 850,140 Q 1060,110 1240,122 T 1420,185" 
        stroke="#38bdf8" stroke-width="8" stroke-opacity="0.09" fill="none" filter="url(#corona-bloom)" />

  <!-- Outer Ionosphere Cyan Halo (Glow above the horizon) -->
  <path d="M 240,155 Q 660,75 1060,60 T 1440,175" 
        stroke="#0284c7" stroke-width="14" stroke-opacity="0.4" fill="none" filter="url(#corona-bloom)" />
  <path d="M 240,155 Q 660,75 1060,60 T 1440,175" 
        stroke="#00d2ff" stroke-width="6" stroke-opacity="0.6" fill="none" filter="url(#soft-glow)" />

  <!-- Crisp Luminous Atmospheric Rim Edge -->
  <path d="M 240,155 Q 660,75 1060,60 T 1440,175" 
        stroke="url(#atmo-limb)" stroke-width="2.6" stroke-linecap="round" fill="none" />

  <!-- Brilliant Solar Sunrise Bloom at Curvature Apex (1060, 60) -->
  <ellipse cx="1060" cy="60" rx="90" ry="40" fill="url(#solar-burst)" />
  <circle cx="1060" cy="60" r="18" fill="#ffffff" opacity="0.9" filter="url(#soft-glow)" />

  <!-- Anamorphic flare streak across horizon apex -->
  <ellipse cx="1060" cy="60" rx="280" ry="2.2" fill="url(#lens-streak)" />
</svg>
